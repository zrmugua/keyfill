name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses & install compileSdk
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.2" || "$SDKMANAGER" --channel=3 "platforms;android-37.2"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release APK & Run Lint
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease lintDebug --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "KeyFill-${GITHUB_REF_NAME}.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: KeyFill-apk
          path: KeyFill-*.apk

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: KeyFill-*.apk
          generate_release_notes: true
