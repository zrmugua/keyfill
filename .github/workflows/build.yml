name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          IS_TAG_RELEASE=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IS_TAG_RELEASE=true
          fi

          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/keyfill-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
            echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "REQUIRE_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
            echo "Release signing keystore configured."
          elif [[ "$IS_TAG_RELEASE" == "true" ]]; then
            echo "::error::Release tag builds require KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets so APK signatures remain stable across releases."
            exit 1
          else
            echo "No release signing secrets configured for non-tag build; falling back to debug signing."
          fi

      - name: Accept Android SDK licenses & install compileSdk
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.2" || "$SDKMANAGER" --channel=3 "platforms;android-37.2"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release APK & Run Lint
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease lintDebug --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "KeyFill-${GITHUB_REF_NAME}.apk"

      - name: Verify APK Signing Certificate
        run: |
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "KeyFill-${GITHUB_REF_NAME}.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: KeyFill-apk
          path: KeyFill-*.apk

      - name: Prepare Release Notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          TAG_MSG="$(git for-each-ref --format='%(contents)' "refs/tags/${TAG}" | sed '/^[[:space:]]*$/d')"
          {
            if printf '%s\n' "$TAG_MSG" | grep -q '^- '; then
              printf '%s\n' "$TAG_MSG"
            else
              if [ -n "$PREV_TAG" ]; then
                git log "${PREV_TAG}..${TAG}" --no-merges --pretty=format:'- %s'
              else
                git log -n 10 --no-merges --pretty=format:'- %s'
              fi
              printf '\n'
            fi
            if [ -n "$PREV_TAG" ]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "${GITHUB_REPOSITORY}" "${PREV_TAG}" "${TAG}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release on Tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: KeyFill-*.apk
          body_path: release-notes.md
