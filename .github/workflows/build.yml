name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK preview/platform packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --channel=3 "build-tools;36.0.0" "platforms;android-36" "platforms;android-37.2" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK & Run Lint
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug lintDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyFill-debug-apk
          path: app/build/outputs/apk/debug/*.apk
