plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.mugua.keyfill'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId = 'com.mugua.keyfill'
        minSdk = 36
        targetSdk = 36
        versionCode = 36
        versionName = '0.3.23'
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    compileOnly 'androidx.annotation:annotation:1.9.1'
    implementation 'io.github.libxposed:service:102.0.0'
    implementation 'androidx.autofill:autofill:1.3.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.5-beta03'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.5-beta03'
    implementation 'top.yukonga.miuix.kmp:miuix-glass-android:0.9.5-beta03'
}
