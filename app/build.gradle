plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def signingProps = new Properties()
def signingPropsFile = rootProject.file('signing.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

def resolvedStorePath = System.getenv('KEYSTORE_FILE') ?: signingProps.getProperty('storeFile')
def resolvedStorePassword = System.getenv('KEYSTORE_PASSWORD') ?: signingProps.getProperty('storePassword')
def resolvedKeyAlias = System.getenv('KEY_ALIAS') ?: signingProps.getProperty('keyAlias')
def resolvedKeyPassword = System.getenv('KEY_PASSWORD') ?: signingProps.getProperty('keyPassword')

def resolvedStoreFile = resolvedStorePath ? rootProject.file(resolvedStorePath) : null
def hasReleaseSigning = resolvedStoreFile != null && resolvedStoreFile.exists() &&
        resolvedStorePassword && resolvedKeyAlias && resolvedKeyPassword
def requireReleaseSigning = System.getenv('REQUIRE_RELEASE_SIGNING') == 'true'

if (requireReleaseSigning && !hasReleaseSigning) {
    throw new GradleException(
            'REQUIRE_RELEASE_SIGNING=true, but release keystore configuration is missing or keystore file does not exist.'
    )
}

android {
    namespace = 'com.mugua.keyfill'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId = 'com.mugua.keyfill'
        minSdk = 33
        targetSdk = 36
        versionCode = 41
        versionName = '0.5.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = resolvedStoreFile
                storePassword = resolvedStorePassword
                keyAlias = resolvedKeyAlias
                keyPassword = resolvedKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = false
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    compileOnly 'androidx.annotation:annotation:1.9.1'
    implementation 'io.github.libxposed:service:102.0.0'
    implementation 'androidx.autofill:autofill:1.3.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.5-beta03'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.5-beta03'
    implementation 'top.yukonga.miuix.kmp:miuix-glass-android:0.9.5-beta03'
}
